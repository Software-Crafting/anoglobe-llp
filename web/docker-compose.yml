# Local Postgres for the site. Start with: docker compose --env-file .env.local up -d
services:
  db:
    image: postgres:17.5
    container_name: anoglobe-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: anoglobe
      POSTGRES_USER: anoglobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - anoglobe-pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  anoglobe-pg-data:
