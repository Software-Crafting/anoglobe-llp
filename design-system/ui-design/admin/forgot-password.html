<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Anoglobe Admin</title>
  <meta name="description" content="Reset your Anoglobe admin password.">
  <meta name="robots" content="noindex">
  <!-- shell:head -->
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <script src="../../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components/foundations.css">
  <link rel="stylesheet" href="../../assets/css/components/forms.css">
  <link rel="stylesheet" href="../../assets/css/components/overlays.css">
  <link rel="stylesheet" href="../../assets/css/components/data.css">
  <link rel="stylesheet" href="../../assets/css/components/payment.css">
  <link rel="stylesheet" href="../../assets/css/components/admin.css">
  <link rel="stylesheet" href="../../assets/css/components/feedback.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <script src="../../assets/js/components/core.js" defer></script>
  <script src="../../assets/js/components/forms.js" defer></script>
  <script src="../../assets/js/components/overlays.js" defer></script>
  <script src="../../assets/js/components/data.js" defer></script>
  <script src="../../assets/js/components/payment.js" defer></script>
  <script src="../../assets/js/components/admin.js" defer></script>
  <script src="../../assets/js/components/site.js" defer></script>
  <script src="../../assets/js/components/feedback.js" defer></script>
  <!-- /shell:head -->
</head>
<body>
  <a class="a-skip-link" href="#main">Skip to content</a>
  <div class="a-auth__theme"><button type="button" class="a-btn a-btn--ghost a-btn--icon a-theme-toggle" data-theme-toggle aria-label="Dark theme"><svg class="a-icon a-theme-toggle__sun" aria-hidden="true"><use href="#sun"></use></svg><svg class="a-icon a-theme-toggle__moon" aria-hidden="true"><use href="#moon"></use></svg></button></div>
  <main id="main" class="a-auth">
    <div class="a-auth__card" data-resume>
      <img class="a-logo a-logo--light" src="../../assets/img/logo.svg" width="223" height="28" alt="Anoglobe Bookkeeping"><img class="a-logo a-logo--dark" src="../../assets/img/logo-reversed.svg" width="223" height="28" alt="Anoglobe Bookkeeping">
      <div data-resume-state="form" class="a-form-grid">
        <div class="a-auth__head"><h1>Reset your password</h1><p>Enter your work email and we will send a reset link that lasts 30 minutes.</p></div>
        <form class="a-form-grid" data-validate-form data-resume-form novalidate>
          <div class="a-field " data-msg-required="Enter your work email" data-msg-pattern="Enter an email like name@company.com">
  <label class="a-label" for="reset-email"><span>Work email<span class="a-label__required" aria-hidden="true">*</span></span></label>
  <input class="a-input" id="reset-email" name="reset-email" type="email" aria-describedby="reset-email-error" required autocomplete="username">
  <p class="a-error" id="reset-email-error"></p>
</div>
          <button type="submit" class="a-btn a-btn--primary a-btn--block">Send reset link</button>
        </form>
        <p class="a-auth__foot"><a href="login.html">Back to sign in</a></p>
      </div>
      <div data-resume-state="sent" hidden class="a-result">
        <svg class="a-illus" aria-hidden="true"><use href="#illus-empty-inbox"></use></svg>
        <h2 class="a-result__title" tabindex="-1">Check your email</h2>
        <p class="a-result__text">If that address belongs to a team account, a reset link is on its way.</p>
        <div class="a-btn-row"><button type="button" class="a-btn a-btn--outline" data-resend>Resend link</button><a class="a-btn a-btn--primary" href="login.html">Back to sign in</a></div>
      </div>
    </div>
  </main>
  <div class="a-toast-region" data-icons="check-circle x-circle info alert-triangle close"></div>
  <!-- icons -->
  <svg class="a-sprite" aria-hidden="true" focusable="false">
    <symbol id="alert-triangle" viewBox="0 0 24 24"><path d="M10.3 4.4a2 2 0 0 1 3.4 0l7.6 13.1a2 2 0 0 1-1.7 3H4.4a2 2 0 0 1-1.7-3z" style="stroke-dasharray: calc(57.868 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(49.767 - var(--icon-gap) / 2)"/><path d="M12 9.5v4"/><path d="M12 16.8h.01" style="stroke-width: calc(var(--icon-stroke) * 1.6)"/></symbol>
    <symbol id="check-circle" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" style="stroke-dasharray: calc(56.569 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(49.781 - var(--icon-gap) / 2)"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></symbol>
    <symbol id="illus-empty-inbox" viewBox="0 0 96 96"><g stroke-width="var(--illus-stroke, 2.5)" stroke-linecap="round" stroke-linejoin="round"><path style="fill: var(--illus-surface, currentColor); fill-opacity: var(--illus-surface-opacity, .12); stroke: none" d="M14 52h68v22a6 6 0 0 1-6 6H20a6 6 0 0 1-6-6z"/><path style="fill: none; stroke: var(--illus-line, currentColor)" d="M14 52 24 24a4 4 0 0 1 3.8-2.8h40.4A4 4 0 0 1 72 24l10 28v22a6 6 0 0 1-6 6H20a6 6 0 0 1-6-6z"/><path style="fill: none; stroke: var(--illus-line, currentColor)" d="M14 52h18l4 8h24l4-8h18"/><path style="fill: none; stroke: var(--illus-accent, currentColor)" d="M40 36h16M44 43h8"/></g></symbol>
    <symbol id="info" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" style="stroke-dasharray: calc(56.569 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(49.781 - var(--icon-gap) / 2)"/><path d="M12 11v5.5"/><path d="M12 7.8h.01" style="stroke-width: calc(var(--icon-stroke) * 1.6)"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" style="stroke-dasharray: calc(58.676 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(26.404 - var(--icon-gap) / 2)"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><path d="M12 7.8a4.2 4.2 0 1 1 0 8.4a4.2 4.2 0 1 1 0 -8.4z" style="stroke-dasharray: calc(26.393 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(23.226 - var(--icon-gap) / 2)"/><path d="M12 2.5v2"/><path d="M12 19.5v2"/><path d="M2.5 12h2"/><path d="M19.5 12h2"/><path d="M5.6 5.6l1.2 1.2"/><path d="M17.2 17.2l1.2 1.2"/><path d="M5.6 18.4l1.2-1.2"/><path d="M17.2 6.8l1.2-1.2"/></symbol>
    <symbol id="x-circle" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0 -18z" style="stroke-dasharray: calc(56.569 - var(--icon-gap)) var(--icon-gap); stroke-dashoffset: calc(49.781 - var(--icon-gap) / 2)"/><path d="M9.2 9.2l5.6 5.6"/><path d="M14.8 9.2l-5.6 5.6"/></symbol>
  </svg>
  <!-- /icons -->
</body>
</html>
